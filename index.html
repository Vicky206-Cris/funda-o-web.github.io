<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundação Web</title>
</head>
<body>
    <h1>Bem-Vindo(a) a Smart Control</h1>
    <h2>Tela De Login - Smart Control</h2>
    <form method="get">
        
        <label for="email">E-mail:</label>
        <input type="email" name="email" id="email" placeholder="Digite seu e-mail">

        <label for="senha">Senha:</label>
        <input type="senha" name="senha" id="senha" placeholder="Digite sua senha de acesso">


        <label for="esqueceu_senha">Esqueceu a senha:</label>
        <input type="esqueceu_senha" name="esqueceu_senha" id="esqueceu_senha" placeholder="Faça uma nova senha">


        <button type="submit">Entrar</button>
        <!-- <input type="submit" value="Entrar"-->

        <button type="submit">Criar nova conta</button>
        <!-- <input type="submit" value=Criar nova conta-->

        <ul><a href="dashboard.html" type="button" target="_blank"> </a></ul>


   </form>
</body>
</html>
